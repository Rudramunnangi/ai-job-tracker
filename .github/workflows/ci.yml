name: NexJob AI Test Suite & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Execute automated pytest suite
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_test_key_for_ci' }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '367560024253-mock.apps.googleusercontent.com' }}
      run: |
        pytest test_app.py -v
